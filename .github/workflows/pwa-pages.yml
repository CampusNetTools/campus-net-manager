name: Deploy CampusNetManager PWA

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - ".github/workflows/pwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusnet-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static PWA to GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Upload PWA static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
