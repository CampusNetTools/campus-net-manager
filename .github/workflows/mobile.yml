name: 手机版 APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", "core/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装打包目录 (main.py + core/ + buildozer.spec)
        run: |
          mkdir -p build_mobile
          cp mobile/main.py mobile/buildozer.spec build_mobile/
          cp -r core build_mobile/
          ls build_mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 buildozer 依赖 (SDK/NDK/下载)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: 安装 buildozer
        run: pip install buildozer cython==0.29.36

      - name: 配置使用 runner 预装 Android SDK（许可已接受）
        run: |
          # android.sdk_path 必须在 [app] 段内, 直接 append 会落到 [buildozer] 段被忽略
          sed -i "/^\[app\]/a\\
android.sdk_path = $ANDROID_HOME" build_mobile/buildozer.spec
          grep -A2 "^\[app\]" build_mobile/buildozer.spec | head -4
          ls "$ANDROID_HOME/build-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 构建 debug APK
        working-directory: build_mobile
        run: buildozer android debug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 校园网连接管家-android-debug-apk
          path: build_mobile/bin/*.apk
