name: 手机版 APK

# APK CI (相关改动推送时和手动触发). Uses a pinned p4a release with API 36 service-type support
# and explicitly pins the Python recipe to 3.11.8.
on:
  workflow_dispatch:
  push:
    branches: [codex/full-project-closure]
    paths:
      - .github/workflows/mobile.yml
      - mobile/**
      - core/**
      - scripts/patch_p4a_special_use.py
      - tests/test_p4a_special_use_patch.py

jobs:
  build-apk:
    name: 构建 Android APK (debug)
    # p4a 的 libffi 配方与 Ubuntu 24.04 的 autoconf 2.72/libtool 不兼容
    # (configure.ac: LT_SYS_SYMBOL_USCORE possibly undefined macro), 22.04 可正常构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 组装打包目录 (UI + foreground service + core)
        run: |
          mkdir -p build_mobile
          cp mobile/main.py mobile/buildozer.spec build_mobile/
          cp mobile/guard_service.py build_mobile/
          cp -r mobile/services build_mobile/
          cp -r mobile/java build_mobile/
          cp -r core build_mobile/
          ls build_mobile

      - name: 准备固定版本 python-for-android 并补充 special-use 说明
        run: |
          git clone --depth 1 --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git "$GITHUB_WORKSPACE/python-for-android"
          python scripts/patch_p4a_special_use.py "$GITHUB_WORKSPACE/python-for-android"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 buildozer 依赖 (SDK/NDK/下载)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: 安装 Android 交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zip unzip \
            autoconf automake libtool pkg-config autoconf-archive \
            gettext autopoint
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> "$GITHUB_ENV"

      - name: 安装 buildozer
        run: pip install buildozer cython==0.29.36

      - name: 配置使用 runner 预装 Android SDK（许可已接受）
        run: |
          python3 -c "
          import os
          p = 'build_mobile/buildozer.spec'
          s = open(p).read()
          assert 'android.sdk_path' not in s
          s = s.replace('[app]', '[app]\nandroid.sdk_path = ' + os.environ['ANDROID_HOME']
                       + '\np4a.source_dir = ' + os.path.join(os.environ['GITHUB_WORKSPACE'], 'python-for-android'), 1)
          open(p, 'w').write(s)
          print([ln for ln in s.splitlines() if 'sdk_path' in ln])
          "
          ls "$ANDROID_HOME/build-tools"
          # p4a 按旧布局找 $SDK/tools/bin/sdkmanager, 新 SDK 在 cmdline-tools 下, 建符号链接兼容
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: 构建 Android API 36 debug APK
        working-directory: build_mobile
        run: buildozer android debug

      - name: 校验 APK 中的前台服务声明
        run: |
          apk=$(find build_mobile/bin -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/campusnet-manifest.txt
          require_manifest_value() {
            local value="$1"
            if ! grep -q "$value" /tmp/campusnet-manifest.txt; then
              echo "::error::APK manifest is missing: $value"
              grep -E 'FOREGROUND_SERVICE|SPECIAL_USE|ServiceCampusguard|foregroundServiceType' \
                /tmp/campusnet-manifest.txt || true
              exit 1
            fi
          }
          require_manifest_value 'FOREGROUND_SERVICE_SPECIAL_USE'
          require_manifest_value 'PROPERTY_SPECIAL_USE_FGS_SUBTYPE'
          require_manifest_value 'campusnetmanager.ServiceCampusguard'
          require_manifest_value 'foregroundServiceType'
          # aapt prints this enum as 0x00000400 on current build tools.
          if ! grep -Eq '0x0*400' /tmp/campusnet-manifest.txt; then
            echo '::error::APK manifest does not contain the specialUse foreground-service flag (0x400).'
            grep -n -A3 -B3 'foregroundServiceType' /tmp/campusnet-manifest.txt || true
            exit 1
          fi

      - name: 启用 GitHub runner 的 KVM 权限
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The hosted runner may already have created /dev/kvm before the
          # udev rule was installed. Set its permissions directly as well.
          ls -l /dev/kvm
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: 在 Android API 36 模拟器安装并启动 APK
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            apk=$(find build_mobile/bin -maxdepth 1 -name '*.apk' -print -quit)
            test -n "$apk"
            adb install "$apk"
            adb shell monkey -p org.campusnettools.campusnetmanager 1
            for attempt in $(seq 1 30); do
              pid=$(adb shell pidof org.campusnettools.campusnetmanager | tr -d '\r' || true)
              if [ -n "$pid" ]; then
                echo "CampusNetManager emulator process started: $pid"
                break
              fi
              sleep 1
            done
            if [ -z "$pid" ]; then
              adb logcat -d > build_mobile/emulator-logcat.txt
              echo '::error::CampusNetManager did not start in the Android emulator.'
              exit 1
            fi
            sleep 10
            adb logcat --pid="$pid" -d > build_mobile/emulator-logcat.txt
            if grep -q 'FATAL EXCEPTION' build_mobile/emulator-logcat.txt; then
              echo '::error::Android emulator reported a fatal application exception.'
              grep -n -A12 -B4 'FATAL EXCEPTION' build_mobile/emulator-logcat.txt
              exit 1
            fi
            pid=$(adb shell pidof org.campusnettools.campusnetmanager | tr -d '\r' || true)
            if [ -z "$pid" ]; then
              echo '::error::CampusNetManager exited during the emulator smoke period.'
              exit 1
            fi
            adb shell screencap -p /sdcard/campusnetmanager.png
            adb pull /sdcard/campusnetmanager.png build_mobile/emulator-screen.png

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 校园网连接管家-android-api36-debug-apk
          path: build_mobile/bin/*.apk

      - name: 上传 Android 模拟器运行证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 校园网连接管家-android-api36-emulator-evidence
          path: |
            build_mobile/emulator-logcat.txt
            build_mobile/emulator-screen.png
          if-no-files-found: ignore
