name: 手机版 APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", "core/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装打包目录 (main.py + core/ + buildozer.spec)
        run: |
          mkdir -p build_mobile
          cp mobile/main.py mobile/buildozer.spec build_mobile/
          cp -r core build_mobile/
          ls build_mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 buildozer 依赖 (SDK/NDK/下载)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: 安装 buildozer
        run: pip install buildozer cython==0.29.36

      - name: 构建 debug APK
        working-directory: build_mobile
        run: |
          # 首次运行 buildozer 自装 SDK 时会因许可未接受而失败:
          # 先跑一遍让它装好 cmdline-tools, 接受许可后再正式构建
          buildozer android debug || true
          SDKMANAGER=$(find "$HOME/.buildozer" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi
          buildozer android debug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 校园网连接管家-android-debug-apk
          path: build_mobile/bin/*.apk
