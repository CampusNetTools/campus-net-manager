name: 手机版 APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", "core/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  build-apk:
    name: 构建 Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装打包目录 (main.py + core/ + buildozer.spec)
        run: |
          mkdir -p build_mobile
          cp mobile/main.py mobile/buildozer.spec build_mobile/
          cp -r core build_mobile/
          ls build_mobile

      # ArtemSBulgakov/buildozer-action 封装 kivy/buildozer 官方 Docker 镜像
      # (镜像内自带 Android SDK/NDK/autotools, 许可已接受)。
      # runner 裸装 buildozer 的坑已全部踩过(见 git log):
      #  SDK 许可 / sdkmanager 旧布局 / ubuntu24.04 libffi 配方 / p4a master 默认 Python 3.14 无 android wheel
      - name: 构建 debug APK (buildozer Docker)
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          workdir: build_mobile
          buildozer_version: stable

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 校园网连接管家-android-debug-apk
          path: build_mobile/bin/*.apk
          if-no-files-found: error
