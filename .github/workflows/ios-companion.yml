name: iOS IKEv2 companion

on:
  workflow_dispatch:
  push:
    branches: [main, codex/full-project-closure]
    paths:
      - 'ios/CampusNetCompanion/**'
      - 'ikev2_profile.py'
      - 'scripts/create_ikev2_device_profile.py'
      - 'tests/test_ikev2_profile.py'
      - '.github/workflows/ios-companion.yml'

jobs:
  build-ios-simulator:
    name: Build iOS simulator app (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/CampusNetCompanion
        run: xcodegen generate

      - name: Build for iOS Simulator without signing
        working-directory: ios/CampusNetCompanion
        run: >-
          xcodebuild
          -project CampusNetCompanion.xcodeproj
          -scheme CampusNetCompanion
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
