name: iOS IKEv2 companion

on:
  workflow_dispatch:
  push:
    branches: [main, codex/full-project-closure]
    paths:
      - 'ios/CampusNetCompanion/**'
      - 'ikev2_profile.py'
      - 'scripts/create_ikev2_device_profile.py'
      - 'tests/test_ikev2_profile.py'
      - '.github/workflows/ios-companion.yml'

jobs:
  build-ios-simulator:
    name: Build iOS simulator app (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/CampusNetCompanion
        run: xcodegen generate

      - name: Build for iOS Simulator without signing
        working-directory: ios/CampusNetCompanion
        run: >-
          xcodebuild
          -project CampusNetCompanion.xcodeproj
          -scheme CampusNetCompanion
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: 在 iOS 模拟器安装并启动
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/CampusNetCompanion.app"
          test -d "$app"
          test -f "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for group in data["devices"].values() for d in group
                     if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"], devices[0].get("state", "Shutdown"))
          ')
          udid=${device%% *}
          state=${device#* }
          if [ "$state" != Booted ]; then
            xcrun simctl boot "$udid"
          fi
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$udid" "$bundle_id"

      - name: Package simulator app with bundle directory intact
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/CampusNetCompanion.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$RUNNER_TEMP/CampusNetCompanion-Simulator.app.zip"

      - name: 上传 iOS 模拟器构建产物
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-ios-simulator-unsigned
          path: ${{ runner.temp }}/CampusNetCompanion-Simulator.app.zip
