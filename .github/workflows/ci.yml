name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: 测试与版本校验 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: 运行全部测试
        run: python -m unittest discover -s tests
      - name: 静态检查（未定义名，防拆分漂移）
        shell: bash
        run: |
          pip install pyflakes ruff
          python -m pyflakes core/*.py gui/*.py *.py mobile/main.py > flakes.txt || true
          cat flakes.txt
          if grep -q "undefined name '" flakes.txt; then
            echo "::error::发现未定义名"
            exit 1
          fi
      - name: 静态检查（ruff：真 bug 类规则）
        shell: bash
        run: |
          # F=pyflakes 类, E9=语法类。项目是 star-import 架构:
          # F401(未用导入)/F403/F405 属该架构的已知误报, 显式忽略;
          # 其余(F821 未定义名、F811 重复定义、F841 未用变量)必须为 0 ——
          # F821 真的抓到过 7 处 "except ... as e" 被延迟 lambda 引用的静默崩溃。
          ruff check --no-cache --select F,E9 --ignore F401,F403,F405 .
      - name: 版本号一致性校验
        run: python scripts/sync_version.py --check

  release:
    name: 构建并发布 (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 构建 macOS .app 并打 zip
        if: matrix.target == 'macos'
        run: |
          PYTHON_BIN=python bash scripts/build_macos.sh
          cd dist/macos
          # 资产名/包内名都 ASCII: 中文经 actions/glob 上传被剥前导"-", 且 zip 中文条目名
          # 在部分解压器(python zipfile)会乱码
          mv "校园网连接管家.app" CampusNetManager.app
          zip -rq "CampusNetManager-macOS-arm64-${GITHUB_REF_NAME}.zip" CampusNetManager.app
          mv CampusNetManager.app "校园网连接管家.app"
          # SHA256 校验和资产: 客户端下载后先校验再替换(updater.resolve_expected_sha256)
          python ../../scripts/make_checksum.py \
            "CampusNetManager-macOS-arm64-${GITHUB_REF_NAME}.zip"

      - name: 构建 Windows exe
        if: matrix.target == 'windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "校园网连接管家" --icon icon.ico --collect-all pystray \
            --collect-submodules core --collect-submodules gui \
            --distpath dist/windows --workpath build/pyinstaller-windows \
            app_gui.py
          # exe 内部名用中文「校园网连接管家」(标题栏/任务栏/快捷方式显示中文);
          # 但 Release 资产名必须用 ASCII —— GitHub 对含非 ASCII 字符的资产名会做
          # 规范化(剥掉中文前缀, 实测「校园网连接管家-v5.2.1-win64.exe」被剥成
          # "-v5.2.1-win64.exe"), 这是平台层限制, 换上传方式无法绕过。
          # 客户端 updater 下载后经 final_exe 自动重命名为「校园网连接管家.exe」。
          mv dist/windows/校园网连接管家.exe \
             "dist/windows/CampusNetManager-${GITHUB_REF_NAME}-win64.exe"
          python scripts/make_checksum.py \
            "dist/windows/CampusNetManager-${GITHUB_REF_NAME}-win64.exe"

      - name: 上传 macOS 资产到 Release
        if: matrix.target == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/CampusNetManager-macOS-arm64-${{ github.ref_name }}.zip
            dist/macos/CampusNetManager-macOS-arm64-${{ github.ref_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Windows 资产到 Release
        if: matrix.target == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/CampusNetManager-${{ github.ref_name }}-win64.exe
            dist/windows/CampusNetManager-${{ github.ref_name }}-win64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
