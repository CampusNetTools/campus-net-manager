name: Desktop candidate packages

on:
  # Package builds are unchanged by documentation-only edits. Keep PR CI as the
  # validation path for docs while avoiding redundant native desktop builds.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-candidate-changes:
    name: Check whether the latest commit changes the app
    runs-on: ubuntu-latest
    outputs:
      build-candidate: ${{ steps.check.outputs.build_candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "build_candidate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$PR_BASE_SHA" ]] || ! git rev-parse --verify "$PR_BASE_SHA^{commit}" >/dev/null 2>&1; then
              echo "::error::Could not resolve the pull request base commit."
              exit 1
            fi
            changed=$(git diff --name-only "$PR_BASE_SHA" HEAD)
          else
            if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              echo "build_candidate=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            changed=$(git diff --name-only HEAD^ HEAD)
          fi
          if [[ -z "$changed" ]]; then
            echo "build_candidate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md) ;;
              *) echo "build_candidate=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "build_candidate=false" >> "$GITHUB_OUTPUT"

  build-candidate:
    name: Build and launch smoke (${{ matrix.target }})
    needs: detect-candidate-changes
    if: needs.detect-candidate-changes.outputs.build-candidate == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package dependencies
        run: pip install -r requirements-dev.txt

      - name: Build Windows portable executable
        if: matrix.target == 'windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "校园网连接管家" --icon icon.ico --collect-all pystray \
            --collect-submodules core --collect-submodules gui \
            --distpath dist/windows --workpath build/pyinstaller-windows \
            app_gui.py
          mv dist/windows/校园网连接管家.exe dist/windows/CampusNetManager-windows.exe
          python scripts/make_checksum.py dist/windows/CampusNetManager-windows.exe

      - name: Windows x64 VM UI acceptance (first-run wizard navigation)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          ./scripts/windows_vm_ui_acceptance.ps1 `
            -ExecutablePath (Join-Path $PWD "dist/windows/CampusNetManager-windows.exe") `
            -ReportPath (Join-Path $PWD "dist/windows/windows-ui-acceptance.txt") `
            -ScreenshotPrefix (Join-Path $PWD "dist/windows/windows-ui-wizard") `
            -RunPersistenceProbe

      - name: Download and verify the public Windows release EXE
        if: matrix.target == 'windows'
        id: public-release
        shell: pwsh
        run: |
          $version = python -c 'from keepalive_core import APP_VERSION; print(APP_VERSION)'
          $fileName = "CampusNetManager-v$version-win64.exe"
          $assetDir = Join-Path $env:RUNNER_TEMP "campusnet-public-release"
          New-Item -ItemType Directory -Path $assetDir | Out-Null
          $exePath = Join-Path $assetDir $fileName
          $sidecarPath = "$exePath.sha256"
          $releaseUrl = "https://github.com/CampusNetTools/campus-net-manager/releases/download/v$version"
          Invoke-WebRequest -Uri "$releaseUrl/$fileName" -OutFile $exePath
          Invoke-WebRequest -Uri "$releaseUrl/$fileName.sha256" -OutFile $sidecarPath
          $sidecarHash = ((Get-Content -LiteralPath $sidecarPath -Raw) -split '\s+')[0].ToLowerInvariant()
          $assetHash = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/CampusNetTools/campus-net-manager/releases/tags/v$version"
          $asset = $release.assets | Where-Object { $_.name -eq $fileName } | Select-Object -First 1
          if (-not $asset -or -not $asset.digest.StartsWith('sha256:')) {
            throw "The published Release API has no SHA-256 digest for $fileName."
          }
          $apiHash = $asset.digest.Substring(7).ToLowerInvariant()
          if ($assetHash -ne $sidecarHash -or $assetHash -ne $apiHash) {
            throw "The public Windows executable differs from its checksum or Release API digest."
          }
          "public_release_exe=$exePath" >> $env:GITHUB_OUTPUT
          Write-Output "public_release_asset=$fileName"
          Write-Output "public_release_sha256_verified=true"

      - name: Windows x64 VM UI acceptance (public Release EXE)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          ./scripts/windows_vm_ui_acceptance.ps1 `
            -ExecutablePath "${{ steps.public-release.outputs.public_release_exe }}" `
            -ReportPath (Join-Path $PWD "dist/windows/windows-release-ui-acceptance.txt") `
            -ScreenshotPrefix (Join-Path $PWD "dist/windows/windows-release-wizard") `
            -RunPersistenceProbe

      - name: Build, verify, and launch macOS app
        if: matrix.target == 'macos'
        shell: bash
        run: |
          PYTHON_BIN=python bash scripts/build_macos.sh
          cd dist/macos
          mv "校园网连接管家.app" CampusNetManager.app
          codesign --verify --deep --strict CampusNetManager.app
          ditto -c -k --sequesterRsrc --keepParent CampusNetManager.app \
            "CampusNetManager-macOS-arm64-candidate.zip"
          python ../../scripts/verify_macos_symlinks.py CampusNetManager.app \
            CampusNetManager-macOS-arm64-candidate.zip
          python ../../scripts/make_checksum.py CampusNetManager-macOS-arm64-candidate.zip
          mkdir -p "$RUNNER_TEMP/campusnet-home"
          HOME="$RUNNER_TEMP/campusnet-home" \
            CampusNetManager.app/Contents/MacOS/校园网连接管家 \
            > "$RUNNER_TEMP/campusnet-app-smoke.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 10); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/campusnet-app-smoke.log"
              exit 1
            fi
            sleep 1
          done
          kill "$app_pid"
          wait "$app_pid" || true
          echo "macOS app remained running for 10 seconds after launch."

      - name: Upload Windows candidate
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: campusnetmanager-windows-candidate
          path: |
            dist/windows/CampusNetManager-windows.exe
            dist/windows/CampusNetManager-windows.exe.sha256

      - name: Upload Windows VM UI acceptance report
        if: always() && matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: campusnetmanager-windows-vm-ui-acceptance
          path: |
            dist/windows/windows-ui-acceptance.txt
            dist/windows/windows-ui-wizard-before.png
            dist/windows/windows-ui-wizard-after.png
            dist/windows/windows-release-ui-acceptance.txt
            dist/windows/windows-release-wizard-before.png
            dist/windows/windows-release-wizard-after.png
          if-no-files-found: warn

      - name: Upload macOS candidate
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: campusnetmanager-macos-candidate
          path: |
            dist/macos/CampusNetManager-macOS-arm64-candidate.zip
            dist/macos/CampusNetManager-macOS-arm64-candidate.zip.sha256
