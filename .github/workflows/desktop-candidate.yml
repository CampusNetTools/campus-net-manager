name: Desktop candidate packages

on:
  # Package builds are unchanged by documentation-only edits. Keep PR CI as the
  # validation path for docs while avoiding redundant native desktop builds.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-candidate-changes:
    name: Check whether the latest commit changes the app
    runs-on: ubuntu-latest
    outputs:
      build-candidate: ${{ steps.check.outputs.build_candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "build_candidate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "build_candidate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD)
          if [[ -z "$changed" ]]; then
            echo "build_candidate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md) ;;
              *) echo "build_candidate=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "build_candidate=false" >> "$GITHUB_OUTPUT"

  build-candidate:
    name: Build and launch smoke (${{ matrix.target }})
    needs: detect-candidate-changes
    if: needs.detect-candidate-changes.outputs.build-candidate == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package dependencies
        run: pip install -r requirements-dev.txt

      - name: Build Windows portable executable
        if: matrix.target == 'windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "校园网连接管家" --icon icon.ico --collect-all pystray \
            --collect-submodules core --collect-submodules gui \
            --distpath dist/windows --workpath build/pyinstaller-windows \
            app_gui.py
          mv dist/windows/校园网连接管家.exe dist/windows/CampusNetManager-windows.exe
          python scripts/make_checksum.py dist/windows/CampusNetManager-windows.exe

      - name: Windows x64 VM UI acceptance (first-run wizard navigation)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          ./scripts/windows_vm_ui_acceptance.ps1 `
            -ExecutablePath (Join-Path $PWD "dist/windows/CampusNetManager-windows.exe") `
            -ReportPath (Join-Path $PWD "dist/windows/windows-ui-acceptance.txt")

      - name: Build, verify, and launch macOS app
        if: matrix.target == 'macos'
        shell: bash
        run: |
          PYTHON_BIN=python bash scripts/build_macos.sh
          cd dist/macos
          mv "校园网连接管家.app" CampusNetManager.app
          codesign --verify --deep --strict CampusNetManager.app
          ditto -c -k --sequesterRsrc --keepParent CampusNetManager.app \
            "CampusNetManager-macOS-arm64-candidate.zip"
          python ../../scripts/verify_macos_symlinks.py CampusNetManager.app \
            CampusNetManager-macOS-arm64-candidate.zip
          python ../../scripts/make_checksum.py CampusNetManager-macOS-arm64-candidate.zip
          mkdir -p "$RUNNER_TEMP/campusnet-home"
          HOME="$RUNNER_TEMP/campusnet-home" \
            CampusNetManager.app/Contents/MacOS/校园网连接管家 \
            > "$RUNNER_TEMP/campusnet-app-smoke.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 10); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/campusnet-app-smoke.log"
              exit 1
            fi
            sleep 1
          done
          kill "$app_pid"
          wait "$app_pid" || true
          echo "macOS app remained running for 10 seconds after launch."

      - name: Upload Windows candidate
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: campusnetmanager-windows-candidate
          path: |
            dist/windows/CampusNetManager-windows.exe
            dist/windows/CampusNetManager-windows.exe.sha256

      - name: Upload Windows VM UI acceptance report
        if: always() && matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: campusnetmanager-windows-vm-ui-acceptance
          path: dist/windows/windows-ui-acceptance.txt
          if-no-files-found: warn

      - name: Upload macOS candidate
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: campusnetmanager-macos-candidate
          path: |
            dist/macos/CampusNetManager-macOS-arm64-candidate.zip
            dist/macos/CampusNetManager-macOS-arm64-candidate.zip.sha256
